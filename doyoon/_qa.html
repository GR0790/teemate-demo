<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>QA viewport</title>
<style>
  html,body{margin:0;background:#7f8fa4}
  iframe{border:0;display:block;background:#fff;margin:0 auto}
</style></head>
<body>
<iframe id="f" title="qa"></iframe>
<script>
  var p = new URLSearchParams(location.search);
  var w = parseInt(p.get('w') || '390', 10);
  var h = parseInt(p.get('h') || '844', 10);
  var full = p.get('full') === '1';
  var f = document.getElementById('f');
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  f.src = p.get('p') || './index.html';
  f.addEventListener('load', function () {
    if (!full) return;
    try {
      var d = f.contentDocument;
      f.style.height = Math.max(h, d.documentElement.scrollHeight) + 'px';
    } catch (e) {}
  });
</script>
</body></html>
